<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>git universe · every developer is a galaxy</title>
<meta name="description" content="Type a GitHub username and watch their galaxy form. Repos are stars, pushes are comets.">
<meta property="og:title" content="git universe: every developer is a galaxy">
<meta property="og:description" content="Type a GitHub username and watch their galaxy form. Repos are stars, pushes are comets.">
<meta property="og:image" content="https://finding-haseeb.github.io/git-galaxy/universe.png">

<style>
:root{--bg:#02030a;--fg:#e8ecff;--dim:#8a93b8;--panel:rgba(10,12,28,.74);--line:rgba(140,160,255,.18);--accent:#8fa2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
canvas.point{cursor:pointer}
button{font:inherit;color:inherit}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{position:fixed;top:16px;left:16px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;z-index:2}
.top h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em}
.top h1 span{color:var(--accent)}
.sub{color:var(--dim);font-variant-numeric:tabular-nums}
.add{display:flex;gap:6px;padding:5px}
.add input{all:unset;flex:1;min-width:0;padding:7px 10px;font-size:14px}
.add input::placeholder{color:var(--dim)}
.add button,.bar button,.card .x{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;white-space:nowrap}
.add button{background:#26357f}
.add button:hover{background:#31449e}
.msg{color:var(--dim);min-height:1.4em;text-shadow:0 0 6px #000}
.msg.err{color:#ff9aa8}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;z-index:2}
.bar button{border-radius:999px}
.bar button:hover,.card .x:hover{background:rgba(255,255,255,.08)}
.bar button.on{background:rgba(143,162,255,.24)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.gl{all:unset;position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(6,8,20,.6);border:1px solid var(--line);white-space:nowrap;pointer-events:auto;cursor:pointer;font-size:12px;will-change:transform;transition:opacity .3s}
.gl:hover{border-color:var(--accent)}
.gl img{width:20px;height:20px;border-radius:50%;background:#1a1f3a}
.rl{position:absolute;left:0;top:0;font-size:11px;color:#d6dcff;white-space:nowrap;text-shadow:0 0 4px #000,0 0 10px #000;will-change:transform}
.card{position:fixed;top:16px;right:16px;width:320px;max-height:calc(100vh - 100px);overflow:auto;padding:16px;z-index:2}
.card[hidden]{display:none}
.card .x{position:absolute;top:8px;right:8px;padding:2px 9px;font-size:18px;color:var(--dim)}
.who{display:flex;gap:12px;align-items:center;padding-right:24px}
.who img{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:#1a1f3a;flex:none}
.who h2{margin:0;font-size:17px;line-height:1.2;word-break:break-word}
.who .login{color:var(--dim)}
.bio{margin:10px 0 0;color:#c4cbe6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
.stat{background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);font-size:11px}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 6px;font-weight:600}
.langs{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.lk{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--dim);font-size:11px;margin-top:8px}
.lk i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.act{color:#c4cbe6}
.act i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 5px 0 0}
.repos a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;margin:0 -8px;border-radius:6px;color:var(--fg);text-decoration:none}
.repos a:hover{background:rgba(255,255,255,.06)}
.repos a b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repos a span{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.gh{display:block;text-align:center;margin-top:14px;background:rgba(255,255,255,.07);border-radius:8px;padding:8px;color:var(--fg);text-decoration:none}
.gh:hover{background:rgba(255,255,255,.12)}
.tip{position:fixed;pointer-events:none;max-width:300px;padding:8px 10px;display:none;z-index:3}
.tip b{display:block;font-weight:600;word-break:break-word}
.tip p{margin:2px 0 0;color:#c4cbe6}
.tip span{display:block;color:var(--dim);margin-top:2px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}
.toast.show{opacity:1}
.corner{position:fixed;left:16px;bottom:22px;color:var(--dim);text-decoration:none;font-size:12px;z-index:2}
.corner:hover{color:var(--fg)}
@media (max-width:760px){
  .card{top:auto;bottom:72px;left:16px;right:16px;width:auto;max-height:42vh}
  .corner{display:none}
  .bar button{padding:7px 11px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="GitHub developers drawn as galaxies in a universe"></canvas>
<div id="labels"></div>
<header class="top">
  <div><h1>git <span>universe</span></h1><div class="sub" id="sub"></div></div>
  <form class="add panel" id="add" autocomplete="off">
    <input id="who" placeholder="Add any GitHub username" aria-label="GitHub username" spellcheck="false" maxlength="40">
    <button>Summon</button>
  </form>
  <div class="msg" id="msg" role="status">Every developer is a galaxy. Repos are stars. Pushes are comets.</div>
</header>
<aside class="card panel" id="card" hidden></aside>
<nav class="bar panel"><button id="home">Universe</button><button id="tour">Tour</button><button id="share">Share</button><button id="save">Save PNG</button></nav>
<a class="corner" href="galaxy.html">Map one repo's commits →</a>
<div class="tip panel" id="tip"></div>
<div class="toast panel" id="toast"></div>
<script src="snapshot.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const STILL = /[?&]still\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches;
const SNAP = (window.SNAPSHOT && window.SNAPSHOT.people) || [];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
  : n >= 1e4 ? Math.round(n / 1e3) + 'k'
  : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
const ago = t => {
  const d = (Date.now() - t) / 864e5;
  return d < 1 ? 'today' : d < 2 ? 'yesterday' : d < 60 ? Math.round(d) + 'd ago'
    : d < 730 ? Math.round(d / 30) + 'mo ago' : Math.round(d / 365) + 'y ago';
};
const hash = s => { let h = 2166136261; for (const ch of s.toLowerCase()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const rng = seed => () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
const hsl = (h, s, l) => {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l), k = n => (n + h / 30) % 12;
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
};

const LANG = {
  JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#4b8bd4', Go: '#00add8', Rust: '#dea584',
  C: '#a8b9cc', 'C++': '#f34b7d', 'C#': '#5fbf3f', Java: '#e0912a', Ruby: '#cc342d', Shell: '#89e051',
  HTML: '#e34c26', CSS: '#8a6fd1', SCSS: '#c6538c', Swift: '#f05138', Kotlin: '#a97bff', PHP: '#7b86c7',
  Vue: '#41b883', Svelte: '#ff3e00', Lua: '#5f7bff', 'Jupyter Notebook': '#da5b0b', Zig: '#ec915c',
  Elixir: '#a07ab8', Haskell: '#9a8bd0', Dart: '#00b4ab', 'Objective-C': '#438eff', Nix: '#7e7eff',
  Makefile: '#6fae3f', 'Vim Script': '#199f4b', 'Emacs Lisp': '#c065db', Astro: '#ff5a03', MDX: '#fcb32c',
  Dockerfile: '#5b9bd5', Scala: '#c22d40', Clojure: '#db5855', OCaml: '#ef7a08', Julia: '#a270ba',
  R: '#198ce7', Perl: '#4f8fd6', Assembly: '#9fa8da', Solidity: '#aa6746', Elm: '#60b5cc', Tcl: '#e4cc98',
};
const NOLANG = '#cfd6ee';
const EV = { PushEvent: ['#ffffff', 'pushes'], PullRequestEvent: ['#ff6fb5', 'pull requests'], CreateEvent: ['#5effc0', 'new branches & repos'], IssuesEvent: ['#ffd166', 'issues'] };

const sprites = new Map();
function glow(c, core) {
  const key = c + core;
  if (sprites.has(key)) return sprites.get(key);
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const x = s.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  if (core) { gr.addColorStop(0, '#fff8ee'); gr.addColorStop(0.07, c); gr.addColorStop(0.3, c + '50'); }
  else { gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.1, c); gr.addColorStop(0.3, c + '44'); }
  gr.addColorStop(1, c + '00');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  sprites.set(key, s); return s;
}

// ---------- building galaxies ----------
const galaxies = [];
let focused = null;

function gauss(r) { return Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(6.2832 * r()); }

function place(size, seed) {
  const r = rng(seed ^ 0x9e3779b9);
  let c = { x: 0, y: 0, z: 0 };
  for (let k = 0; k < 80; k++) {
    const spread = 12 + galaxies.length * 3.2 + k * 0.8;
    c = { x: (r() - 0.5) * 2 * spread, y: (r() - 0.5) * 2 * spread, z: (r() - 0.5) * spread * 0.7 };
    if (galaxies.every(o => Math.hypot(o.c.x - c.x, o.c.y - c.y, o.c.z - c.z) > o.size + size + 7)) break;
  }
  return c;
}

function addGalaxy(p, born) {
  const u = p.user, login = u.login, seed = hash(login), r = rng(seed);
  const own = p.repos.slice().sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
  const stars = own.reduce((s, x) => s + (x.stargazers_count || 0), 0);
  const size = 2.2 + 1.1 * Math.log10(1 + (u.followers || 0) + stars / 5);
  const hue = seed % 360, arms = 2 + Math.floor(r() * 3), twist = 1.8 + r() * 1.4;
  const tx = (r() - 0.5) * 1.3, tz = r() * 6.2832;
  const ca = Math.cos(tx), sa = Math.sin(tx), cz = Math.cos(tz), sz = Math.sin(tz);
  const M = [cz, -sz * ca, sz * sa, sz, cz * ca, -cz * sa, 0, sa, ca]; // Rz(tz)·Rx(tx): the disk's tilt
  const armAngle = a => a * 6.2832 / arms;

  const nd = Math.round(clamp(260 + 95 * Math.log(1 + (u.followers || 0)), 260, 1500));
  const dR = new Float32Array(nd), dT = new Float32Array(nd), dZ = new Float32Array(nd), dB = new Float32Array(nd);
  for (let i = 0; i < nd; i++) {
    if (r() < 0.16) { // bulge
      dR[i] = Math.abs(gauss(r)) * 0.1; dT[i] = r() * 6.2832; dZ[i] = gauss(r) * 0.05;
    } else {
      const rr = 0.08 + Math.pow(r(), 0.8) * 0.95;
      dR[i] = rr;
      dT[i] = armAngle(Math.floor(r() * arms)) + Math.log(1 + rr * 8) * twist + gauss(r) * 0.28;
      dZ[i] = gauss(r) * 0.035 * (1.1 - rr);
    }
    dB[i] = 0.25 + r() * 0.6;
  }

  const n = own.length, t0 = n ? Date.parse(own[0].created_at) : 0;
  const span = Math.max(1, n ? Date.parse(own[n - 1].created_at) - t0 : 1);
  const repos = own.map((x, i) => {
    // oldest repos near the core, newest at the rim, like the commit galaxy
    const f = 0.5 * (n > 1 ? i / (n - 1) : 0.5) + 0.5 * (Date.parse(x.created_at) - t0) / span;
    const rr = 0.14 + f * 0.82 + gauss(r) * 0.03;
    const s = x.stargazers_count || 0;
    return {
      name: x.name, full: `${login}/${x.name}`, stars: s, forks: x.forks_count || 0, lang: x.language,
      color: LANG[x.language] || NOLANG, desc: x.description || '', pushed: Date.parse(x.pushed_at), fork: !!x.fork,
      r: rr, th: armAngle(hash(x.name) % arms) + Math.log(1 + rr * 8) * twist + gauss(r) * 0.16,
      z: gauss(r) * 0.03, w: 0.035 + 0.04 * Math.log10(1 + s), flash: 0, vis: false,
    };
  });
  const byName = new Map(repos.map((x, i) => [x.full.toLowerCase(), i]));
  const comets = [];
  for (const e of p.events) {
    if (!EV[e.type]) continue;
    const full = e.repo.name, key = full.toLowerCase();
    let ri = byName.get(key);
    if (ri === undefined) {
      // a repo someone else owns: it orbits in this galaxy's halo
      ri = repos.length; byName.set(key, ri);
      repos.push({ name: full, full, stars: -1, lang: null, color: '#b7c2ff', desc: '', pushed: Date.parse(e.created_at),
        ext: true, r: 1.05 + r() * 0.25, th: r() * 6.2832, z: gauss(r) * 0.12, w: 0.05, flash: 0, vis: false });
    }
    comets.push({ ri, type: e.type, color: EV[e.type][0], bow: (r() - 0.5) * 0.7 });
  }

  const G = {
    login, user: u, repos, comets, stars, size, hue, M, nd, dR, dT, dZ, dB,
    c: place(size, seed), born: born ?? performance.now(),
    dust: hsl(hue, 70, 76), core: glow(hsl(hue, 85, 72), 1), vis: false, sx: 0, sy: 0, sr: 0,
  };
  G.n = [M[2], M[5], M[8]];
  G.top = repos.filter(x => !x.ext && !x.fork).sort((a, b) => b.stars - a.stars);

  const el = document.createElement('button');
  el.className = 'gl'; el.style.opacity = 0;
  const img = document.createElement('img');
  img.alt = ''; img.loading = 'lazy'; img.src = u.avatar_url + (u.avatar_url.includes('?') ? '&' : '?') + 's=48';
  const t = document.createElement('span'); t.textContent = '@' + login;
  el.append(img, t);
  el.onclick = () => focusOn(G);
  $('labels').append(el);
  G.el = el;
  galaxies.push(G);
  stats();
  return G;
}

function stats() {
  const repos = galaxies.reduce((s, G) => s + G.repos.filter(x => !x.ext).length, 0);
  const stars = galaxies.reduce((s, G) => s + G.stars, 0);
  $('sub').textContent = `${galaxies.length} galaxies · ${fmt(repos)} repos · ${fmt(stars)} ★`;
}

// ---------- camera ----------
const cam = { tx: 0, ty: 0, tz: 0, yaw: 0.6, pitch: 0.95, dist: 80 };
let fly = null, spin = !STILL, tour = null;
function flyTo(to, dur = 1700) {
  const from = { ...cam }, end = { ...cam, ...to };
  let dy = end.yaw - from.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); end.yaw = from.yaw + dy;
  fly = { from, end, t0: performance.now(), dur: STILL ? 1 : dur };
}
function universeView() {
  let x = 0, y = 0, z = 0;
  for (const G of galaxies) { x += G.c.x; y += G.c.y; z += G.c.z; }
  const k = Math.max(1, galaxies.length); x /= k; y /= k; z /= k;
  let ext = 8;
  for (const G of galaxies) ext = Math.max(ext, Math.hypot(G.c.x - x, G.c.y - y, G.c.z - z) + G.size);
  return { tx: x, ty: y, tz: z, dist: ext * 1.45 + 4, pitch: 0.75 };
}
function galaxyView(G) {
  // look at the disk from about 30° off its face
  let [nx, ny, nz] = G.n;
  if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
  return { tx: G.c.x, ty: G.c.y, tz: G.c.z, dist: G.size * 2.7, yaw: Math.atan2(nx, ny), pitch: clamp(Math.acos(nz) + 0.5, 0.2, 1.3) };
}

// ---------- canvas ----------
let W, H, dpr, bg, F, ox, oy, cyw, syw, cp, sp, PX = 0, PY = 0;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const x = bg.getContext('2d'), r = rng(7);
  for (let i = 0; i < 5; i++) { // faint nebulae
    const px = r() * W, py = r() * H, rad = (0.25 + r() * 0.35) * Math.max(W, H);
    const gr = x.createRadialGradient(px, py, 0, px, py, rad);
    gr.addColorStop(0, hsl(200 + r() * 140, 70, 40) + '18'); gr.addColorStop(1, '#00000000');
    x.fillStyle = gr; x.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 900; i++) {
    x.fillStyle = `rgba(200,210,255,${r() * 0.4})`;
    x.fillRect(r() * W, r() * H, dpr * (r() < 0.08 ? 1.6 : 0.8), dpr * 0.8);
  }
}
resize(); addEventListener('resize', resize);

function project(x, y, z) {
  x -= cam.tx; y -= cam.ty; z -= cam.tz;
  const xr = x * cyw - y * syw, yr = x * syw + y * cyw;
  const ys = yr * cp - z * sp, depth = cam.dist + yr * sp + z * cp;
  if (depth < 0.4) return 0;
  const s = F / depth; PX = ox + xr * s; PY = oy + ys * s; return s;
}

const rl = Array.from({ length: 8 }, () => { const e = document.createElement('div'); e.className = 'rl'; $('labels').append(e); return e; });
let hoverables = [], last = performance.now(), hovered = null;

function frame(now) {
  // a page opened in a hidden tab can start at 0×0; wait for a real size
  if (!W || !H) return requestAnimationFrame(frame);
  const dt = Math.min(64, now - last); last = now;
  const T = STILL ? 40 : now / 1000;
  if (spin && !drag && !fly && !focused) cam.yaw += dt * 0.00003;
  if (fly) {
    const k = clamp((now - fly.t0) / fly.dur, 0, 1), e = ease(k), a = fly.from, b = fly.end;
    for (const key of ['tx', 'ty', 'tz', 'yaw', 'pitch']) cam[key] = a[key] + (b[key] - a[key]) * e;
    cam.dist = Math.exp(Math.log(a.dist) + (Math.log(b.dist) - Math.log(a.dist)) * e);
    if (k >= 1) fly = null;
  }
  cyw = Math.cos(cam.yaw); syw = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
  F = Math.min(W, H) * 0.95; ox = W / 2; oy = H / 2;

  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = '#02030a'; g.fillRect(0, 0, W, H); g.drawImage(bg, 0, 0);
  g.globalCompositeOperation = 'lighter';
  hoverables = [];
  let rlUsed = 0;

  for (const G of galaxies) {
    const bornK = STILL ? 1 : clamp((now - G.born) / 1800, 0, 1);
    const s0 = bornK > 0 && project(G.c.x, G.c.y, G.c.z);
    const rad = s0 * G.size;
    G.vis = !!s0 && PX + rad * 1.3 > 0 && PX - rad * 1.3 < W && PY + rad * 1.3 > 0 && PY - rad * 1.3 < H;
    if (!G.vis) { G.el.style.opacity = 0; continue; }
    const cx = G.sx = PX, cy = G.sy = PY; G.sr = rad;
    const grow = 1 - Math.pow(1 - bornK, 3), dim = focused && focused !== G ? 0.35 : 1;
    const M = G.M, size = G.size * grow;

    const cr = Math.max(7 * dpr, rad * 0.55 * grow);
    g.globalAlpha = 0.85 * dim; g.drawImage(G.core, cx - cr, cy - cr, cr * 2, cr * 2);
    if (bornK < 1) { // the birth flash
      const fr = rad * 1.6 * bornK + 10 * dpr;
      g.globalAlpha = 1 - bornK; g.drawImage(glow('#ffffff', 1), cx - fr, cy - fr, fr * 2, fr * 2);
    }

    const step = rad < 12 * dpr ? 6 : rad < 40 * dpr ? 2 : 1;
    g.fillStyle = G.dust;
    for (let i = 0; i < G.nd; i += step) {
      const rr = G.dR[i], th = G.dT[i] + T * 0.035 / (0.25 + rr);
      const lx = rr * size * Math.cos(th), ly = rr * size * Math.sin(th), lz = G.dZ[i] * size;
      const s = project(G.c.x + M[0] * lx + M[1] * ly + M[2] * lz, G.c.y + M[3] * lx + M[4] * ly + M[5] * lz, G.c.z + M[6] * lx + M[7] * ly + M[8] * lz);
      if (!s) continue;
      const px = clamp(0.022 * s, 0.7 * dpr, 2.2 * dpr) * (step > 1 ? 1.4 : 1);
      g.globalAlpha = G.dB[i] * dim;
      g.fillRect(PX - px / 2, PY - px / 2, px, px);
    }

    const detail = rad > 28 * dpr;
    for (const R of G.repos) {
      const th = R.th + T * 0.035 / (0.25 + R.r);
      const lx = R.r * size * Math.cos(th), ly = R.r * size * Math.sin(th), lz = R.z * size;
      const s = project(G.c.x + M[0] * lx + M[1] * ly + M[2] * lz, G.c.y + M[3] * lx + M[4] * ly + M[5] * lz, G.c.z + M[6] * lx + M[7] * ly + M[8] * lz);
      R.vis = !!s; if (!s) continue;
      R.sx = PX; R.sy = PY; R.g = G;
      const fl = R.flash ? Math.max(0, 1 - (now - R.flash) / 800) : 0;
      const w = clamp(R.w * s, 1.4 * dpr, 26 * dpr) * (1 + fl * 1.8);
      g.globalAlpha = (R.fork || R.ext ? 0.45 : 0.95) * dim;
      g.drawImage(glow(R.color), PX - w * 2, PY - w * 2, w * 4, w * 4);
      if (detail) hoverables.push(R);
    }

    if (detail && G.comets.length) {
      g.lineWidth = 1.4 * dpr; g.lineCap = 'round';
      const P = 10;
      for (let k = 0; k < G.comets.length; k++) {
        const C = G.comets[k], R = G.repos[C.ri];
        if (!R.vis) continue;
        const ph = (T / P + k * 0.6180339) % 1;
        if (ph > 0.35) continue;
        const q = ph / 0.35;
        if (q > 0.94 && now - R.flash > 900) R.flash = now;
        // a bowed path from the core out to the repo it touched
        const dx = R.sx - cx, dy = R.sy - cy, mx = cx + dx / 2 - dy * C.bow, my = cy + dy / 2 + dx * C.bow;
        const at = t => [(1 - t) * (1 - t) * cx + 2 * (1 - t) * t * mx + t * t * R.sx, (1 - t) * (1 - t) * cy + 2 * (1 - t) * t * my + t * t * R.sy];
        const [hx, hy] = at(q), [ax, ay] = at(Math.max(0, q - 0.12)), [bx, by] = at(Math.max(0, q - 0.24));
        const gr = g.createLinearGradient(bx, by, hx, hy);
        gr.addColorStop(0, C.color + '00'); gr.addColorStop(1, C.color + 'dd');
        g.globalAlpha = dim; g.strokeStyle = gr;
        g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(ax, ay, hx, hy); g.stroke();
        const hw = 3.2 * dpr;
        g.drawImage(glow(C.color), hx - hw * 2, hy - hw * 2, hw * 4, hw * 4);
      }
    }

    G.el.style.opacity = bornK < 0.5 ? 0 : focused && focused !== G ? 0.45 : 1;
    G.el.style.transform = `translate(${cx / dpr}px,${(cy + Math.max(rad * 0.45, 10 * dpr)) / dpr + 6}px) translateX(-50%)`;

    if (focused === G && detail) {
      for (const R of G.top) {
        if (rlUsed >= rl.length) break;
        if (!R.vis) continue;
        const e = rl[rlUsed++];
        if (e.textContent !== R.name) e.textContent = R.name;
        e.style.opacity = 1;
        e.style.transform = `translate(${R.sx / dpr + 8}px,${R.sy / dpr - 7}px)`;
      }
    }
  }
  for (let i = rlUsed; i < rl.length; i++) rl[i].style.opacity = 0;
  if (hovered && hovered.repo && hovered.repo.vis) {
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 0.9; g.strokeStyle = '#fff'; g.lineWidth = dpr;
    g.beginPath(); g.arc(hovered.repo.sx, hovered.repo.sy, 9 * dpr, 0, 6.2832); g.stroke();
  }
  requestAnimationFrame(frame);
}

// ---------- interaction ----------
function hit(mx, my) {
  let best = null, bd = (14 * dpr) ** 2;
  for (const R of hoverables) {
    if (!R.vis) continue;
    const d = (R.sx - mx) ** 2 + (R.sy - my) ** 2;
    if (d < bd) { bd = d; best = R; }
  }
  if (best) return { repo: best };
  for (const G of galaxies) if (G.vis && Math.hypot(G.sx - mx, G.sy - my) < Math.max(18 * dpr, G.sr * 0.35)) return { gal: G };
  return null;
}

const tip = $('tip');
function showTip(h, e) {
  hovered = h;
  cv.classList.toggle('point', !!h);
  if (!h) { tip.style.display = 'none'; return; }
  tip.replaceChildren();
  const b = document.createElement('b'), sub = document.createElement('span');
  if (h.repo) {
    const R = h.repo;
    b.textContent = R.name;
    tip.append(b);
    if (R.desc) { const p = document.createElement('p'); p.textContent = R.desc; tip.append(p); }
    sub.textContent = R.ext ? `Contributed recently · last activity ${ago(R.pushed)}`
      : [R.stars >= 0 && `★ ${fmt(R.stars)}`, R.lang, R.fork && 'fork', `pushed ${ago(R.pushed)}`].filter(Boolean).join(' · ');
  } else {
    const G = h.gal;
    b.textContent = '@' + G.login;
    tip.append(b);
    sub.textContent = `${fmt(G.user.public_repos || 0)} repos · ★ ${fmt(G.stars)} · ${fmt(G.user.followers || 0)} followers · click to fly in`;
  }
  tip.append(sub);
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}

const pointers = new Map();
let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist }; drag = null;
  } else {
    drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: 0 };
  }
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    cam.dist = clamp(pinch.dist * pinch.d / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), 0.8, 800);
    return;
  }
  if (drag) {
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    if (drag.moved > 5) {
      fly = null; stopTour(); cv.classList.add('drag'); showTip(null);
      cam.yaw = drag.yaw - (e.clientX - drag.x) * 0.005;
      cam.pitch = clamp(drag.pitch + (e.clientY - drag.y) * 0.005, 0.02, 1.5);
    }
    return;
  }
  showTip(hit(e.clientX * dpr, e.clientY * dpr), e);
});
const up = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && drag.moved <= 5 && e.type === 'pointerup') click(hit(e.clientX * dpr, e.clientY * dpr));
  drag = null; cv.classList.remove('drag');
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => showTip(null));
cv.addEventListener('wheel', e => {
  e.preventDefault(); fly = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 0.8, 800);
}, { passive: false });

function click(h) {
  if (!h) return;
  stopTour();
  if (h.repo) {
    if (focused === h.repo.g) window.open('https://github.com/' + h.repo.full, '_blank', 'noopener');
    else focusOn(h.repo.g);
  } else focusOn(h.gal);
}

function focusOn(G, keepTour) {
  if (!keepTour) stopTour();
  focused = G; showTip(null);
  flyTo(galaxyView(G));
  card(G);
}
function goHome() {
  stopTour(); focused = null; $('card').hidden = true;
  flyTo(universeView());
}

// ---------- profile card ----------
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function card(G) {
  const u = G.user, c = $('card');
  c.replaceChildren();
  const x = el('button', 'x', '×'); x.setAttribute('aria-label', 'Back to the universe'); x.onclick = goHome;
  const who = el('div', 'who'), img = el('img');
  img.alt = ''; img.src = u.avatar_url + (u.avatar_url.includes('?') ? '&' : '?') + 's=112';
  const id = el('div'); id.append(el('h2', null, u.name || u.login), el('div', 'login', '@' + u.login));
  who.append(img, id);
  c.append(x, who);
  if (u.bio) c.append(el('p', 'bio', u.bio));

  const st = el('div', 'stats');
  const shown = G.repos.filter(r => !r.ext).length;
  for (const [v, k] of [
    [fmt(u.public_repos || 0), 'public repos'],
    [fmt(G.stars), (u.public_repos || 0) > shown ? `stars, latest ${shown} repos` : 'stars earned'],
    [fmt(u.followers || 0), 'followers'],
    [u.created_at ? new Date(u.created_at).getFullYear() : '–', 'on GitHub since'],
  ]) { const s = el('div', 'stat'); s.append(el('b', null, v), el('span', null, k)); st.append(s); }
  c.append(st);

  const langs = new Map();
  for (const r of G.repos) if (!r.ext && !r.fork && r.lang) langs.set(r.lang, (langs.get(r.lang) || 0) + 1);
  const top = [...langs].sort((a, b) => b[1] - a[1]).slice(0, 6), total = top.reduce((s, l) => s + l[1], 0);
  if (total) {
    c.append(el('h3', null, 'Star colors · languages'));
    const bar = el('div', 'langs'), key = el('div', 'lk');
    for (const [l, n] of top) {
      const seg = el('div'); seg.style.flex = n; seg.style.background = LANG[l] || NOLANG; bar.append(seg);
      const k = el('span'), dot = el('i'); dot.style.background = LANG[l] || NOLANG; k.append(dot, `${l} ${Math.round(n / total * 100)}%`); key.append(k);
    }
    c.append(bar, key);
  }

  c.append(el('h3', null, 'Comets · last 90 days'));
  const counts = {};
  for (const m of G.comets) counts[m.type] = (counts[m.type] || 0) + 1;
  const kinds = Object.keys(EV).filter(t => counts[t]);
  if (!kinds.length) c.append(el('div', 'act', 'No public activity lately. A quiet galaxy.'));
  for (const t of kinds) {
    const row = el('div', 'act'), dot = el('i'); dot.style.background = EV[t][0];
    row.append(dot, `${counts[t]} ${EV[t][1]}`); c.append(row);
  }

  if (G.top.length) {
    c.append(el('h3', null, 'Brightest stars'));
    const list = el('div', 'repos');
    for (const r of G.top.slice(0, 6)) {
      const a = el('a'); a.href = 'https://github.com/' + r.full; a.target = '_blank'; a.rel = 'noopener';
      a.append(el('b', null, r.name), el('span', null, '★ ' + fmt(r.stars))); list.append(a);
    }
    c.append(list);
  }
  const gh = el('a', 'gh', 'Open on GitHub ↗'); gh.href = 'https://github.com/' + u.login; gh.target = '_blank'; gh.rel = 'noopener';
  c.append(gh);
  c.hidden = false; c.scrollTop = 0;
}

// ---------- live GitHub data ----------
const msg = $('msg');
function say(text, err) { msg.textContent = text; msg.classList.toggle('err', !!err); }
const fromSnap = login => SNAP.find(p => p.user.login.toLowerCase() === login.toLowerCase());

async function fetchPerson(login) {
  const key = 'gu:' + login.toLowerCase();
  try { const c = JSON.parse(localStorage.getItem(key)); if (c && Date.now() - c.at < 36e5) return c.p; } catch {}
  const get = async path => {
    const r = await fetch('https://api.github.com/' + path, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) throw new Error(`There's no GitHub user called @${login}.`);
    if (r.status === 403 || r.status === 429) {
      const reset = +r.headers.get('x-ratelimit-reset');
      const mins = reset ? Math.max(1, Math.ceil((reset * 1000 - Date.now()) / 6e4)) : 60;
      throw new Error(`GitHub allows 60 lookups an hour without a login, and they're used up. Try again in ${mins} min.`);
    }
    if (!r.ok) throw new Error(`GitHub answered ${r.status}. Try again in a moment.`);
    return r.json();
  };
  const u = await get(`users/${encodeURIComponent(login)}`);
  const [repos, events] = await Promise.all([
    get(`users/${u.login}/repos?per_page=100&sort=pushed`),
    get(`users/${u.login}/events/public?per_page=100`).catch(() => []),
  ]);
  const p = {
    user: { login: u.login, name: u.name, avatar_url: u.avatar_url, followers: u.followers, public_repos: u.public_repos, created_at: u.created_at, bio: u.bio },
    repos: repos.map(r => ({ name: r.name, stargazers_count: r.stargazers_count, forks_count: r.forks_count, language: r.language,
      created_at: r.created_at, pushed_at: r.pushed_at, description: (r.description || '').slice(0, 120), fork: r.fork })),
    events: events.filter(e => EV[e.type]).map(e => ({ type: e.type, repo: { name: e.repo.name }, created_at: e.created_at })),
  };
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), p })); } catch {}
  return p;
}

const VALID = /^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i;
function syncHash() { history.replaceState(null, '', '#u=' + galaxies.map(G => G.login).join(',')); }

$('add').addEventListener('submit', async e => {
  e.preventDefault();
  const login = $('who').value.trim().replace(/^@/, '');
  if (!login) return;
  if (!VALID.test(login)) return say("That doesn't look like a GitHub username.", true);
  const have = galaxies.find(G => G.login.toLowerCase() === login.toLowerCase());
  if (have) { say(`@${have.login} is already in this universe.`); return focusOn(have); }
  say(`Summoning @${login}…`);
  try {
    const G = addGalaxy(fromSnap(login) || await fetchPerson(login));
    $('who').value = '';
    say(`@${G.login}'s galaxy just formed.`);
    syncHash(); focusOn(G);
  } catch (err) { say(err.message || 'Could not reach GitHub.', true); }
});

// ---------- buttons ----------
function stopTour() { if (tour) { clearInterval(tour); tour = null; $('tour').classList.remove('on'); } }
$('home').onclick = goHome;
$('tour').onclick = () => {
  if (tour) return stopTour();
  let i = focused ? galaxies.indexOf(focused) : -1;
  const next = () => { i = (i + 1) % galaxies.length; focusOn(galaxies[i], true); };
  next(); tour = setInterval(next, 7000); $('tour').classList.add('on');
};
const toast = text => { const t = $('toast'); t.textContent = text; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
$('share').onclick = () => {
  syncHash();
  navigator.clipboard.writeText(location.href).then(() => toast('Link copied. Anyone who opens it gets this exact universe.'), () => toast(location.href));
};
$('save').onclick = () => {
  // stamp names onto the image, since the DOM labels aren't part of the canvas
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.textAlign = 'center';
  g.font = `600 ${12 * dpr}px system-ui,sans-serif`;
  for (const G of galaxies) if (G.vis) {
    g.fillStyle = 'rgba(232,236,255,.9)';
    g.fillText('@' + G.login, G.sx, G.sy + Math.max(G.sr * 0.45, 10 * dpr) + 20 * dpr);
  }
  g.textAlign = 'left';
  g.fillStyle = 'rgba(232,236,255,.95)'; g.font = `650 ${20 * dpr}px system-ui,sans-serif`;
  g.fillText('git universe', 24 * dpr, H - 44 * dpr);
  g.fillStyle = 'rgba(138,147,184,.95)'; g.font = `${12 * dpr}px system-ui,sans-serif`;
  g.fillText('finding-haseeb.github.io/git-galaxy', 24 * dpr, H - 24 * dpr);
  cv.toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = focused ? `${focused.login}-galaxy.png` : 'git-universe.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  });
};
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.activeElement === $('who')) $('who').blur(); else goHome(); }
  if (e.key === '/' && document.activeElement !== $('who')) { e.preventDefault(); $('who').focus(); }
});

// ---------- big bang ----------
async function start() {
  const wanted = (location.hash.match(/u=([^&]+)/) || [])[1];
  const list = wanted ? decodeURIComponent(wanted).split(',').filter(l => VALID.test(l)).slice(0, 16) : SNAP.map(p => p.user.login);
  const t0 = performance.now();
  let i = 0;
  for (const login of list) {
    const p = fromSnap(login);
    if (p) addGalaxy(p, t0 + 400 + i++ * 220);
  }
  const view = universeView();
  Object.assign(cam, view, { dist: view.dist * 2.4 });
  flyTo(view, 3200);
  // anyone not in the snapshot comes from the live API, one at a time
  for (const login of list) {
    if (fromSnap(login) || galaxies.some(G => G.login.toLowerCase() === login.toLowerCase())) continue;
    say(`Summoning @${login}…`);
    try { addGalaxy(await fetchPerson(login)); say('Every developer is a galaxy. Repos are stars. Pushes are comets.'); }
    catch (err) { say(err.message, true); break; }
    if (!focused && !drag) flyTo(universeView(), 1200);
  }
  const deep = new URLSearchParams(location.search).get('focus');
  const target = deep && galaxies.find(G => G.login.toLowerCase() === deep.toLowerCase());
  if (target) focusOn(target);
}
start();
requestAnimationFrame(frame);
})();
</script>
</body>
